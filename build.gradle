plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
}


group = 'fr.Mathildeuh'
version = '4.0.0'

def mcVersion = '1.20.1-R0.1-SNAPSHOT'

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = "papermc"
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        url = "https://jitpack.io/"
    }
    maven {
        url = "https://repo.codemc.io/repository/maven-snapshots/"
    }
    maven {
        url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven {
        name = "jitpack-vault"
        url = "https://jitpack.io"
    }
}

dependencies {
    // Target PaperMC API
    compileOnly "io.papermc.paper:paper-api:${mcVersion}"
    implementation "org.bstats:bstats-bukkit:3.0.2"
    implementation "net.kyori:adventure-text-minimessage:4.17.0"

    implementation 'org.zeroturnaround:zt-zip:1.17'

    implementation 'org.json:json:20231013'
    implementation 'commons-io:commons-io:2.14.0'

    // Database drivers
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'
    // Only classic JDBC (jdbc:mysql://) is used, never X DevAPI (mysqlx://), so the
    // protobuf-java transitive dependency X DevAPI needs is excluded entirely.
    implementation('com.mysql:mysql-connector-j:9.7.0') {
        exclude group: 'com.google.protobuf', module: 'protobuf-java'
    }

    compileOnly 'me.clip:placeholderapi:2.11.6'
    // Soft dependency: only used to price custom portals (util/EconomyHook) - the plugin
    // runs fully without it, every portal is simply free. Only the net.milkbowl.vault.economy.*
    // interfaces are actually used (util/EconomyHook); every org.bukkit.* class it touches comes
    // from paper-api above, never from VaultAPI's own bundled transitive - so that transitive
    // (a several-years-stale org.bukkit:bukkit 1.13.1 snapshot, dragging in an unpatched,
    // CVE-2025-48924-affected commons-lang:commons-lang 2.6) is excluded entirely.
    compileOnly('com.github.MilkBowl:VaultAPI:1.7') {
        exclude group: 'org.bukkit', module: 'bukkit'
    }

    // JetBrains annotations for nullability hints (compileOnly)
    compileOnly 'org.jetbrains:annotations:24.0.1'
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

compileJava.options.encoding("UTF-8")

shadowJar {
    archiveClassifier.set('')
    relocate 'org.bstats', 'fr.mathildeuh.bstats'

    doLast {
        def pluginDir = layout.projectDirectory.dir("server/plugins").asFile
        if (!pluginDir.exists()) {
            pluginDir.mkdirs()
        }
        def jarFile = jar.archiveFile.get().asFile
        copy {
            from jarFile
            into pluginDir
        }
        println "✓ Plugin copied to server/plugins/${jarFile.name}"
    }
}
