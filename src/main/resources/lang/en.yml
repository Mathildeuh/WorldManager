    - "<color:#7d66ff>{</color><color:#6258a6>-----</color> <color:#02a876>Sign Portals</color> <color:#6258a6>-----</color><color:#7d66ff>}</color>"
    - "<gray>No command needed to create one - just place a sign:</gray>"
    - "<gray>Line 1:</gray> <yellow>[WorldManager]</yellow>"
    - "<gray>Line 2:</gray> <yellow>a loaded world's name</yellow>"
    - "<gray>Right-click the sign to teleport there.</gray>"
