  list_item: "<color:#7471b0>➥</color> <yellow>{0}</yellow> ({1}, {2}, {3}) <gray>→</gray> <aqua>{4}</aqua> <gray>(by {5})</gray>"

portal:
  guide:
    - "<color:#7d66ff>{</color><color:#6258a6>-----</color> <color:#02a876>Custom Portals</color> <color:#6258a6>-----</color><color:#7d66ff>}</color>"
    - "<gray>Create a teleport or launch region in 3 steps:</gray>"
    - "<click:suggest_command:'/wm portal pos1'><color:#7471b0>1.</color> <color:#ff9900>/wm portal pos1</color> <dark_gray>-</dark_gray> <color:#ffa1f9>Stand at the first corner, then run this</color></click>"
    - "<click:suggest_command:'/wm portal pos2'><color:#7471b0>2.</color> <color:#ff9900>/wm portal pos2</color> <dark_gray>-</dark_gray> <color:#ffa1f9>Stand at the opposite corner, then run this</color></click>"
    - "<click:suggest_command:'/wm portal create '><color:#7471b0>3.</color> <color:#ff9900>/wm portal create</color> <dark_green>[name]</dark_green> <dark_gray>-</dark_gray> <color:#ffa1f9>Turn the selection into a portal</color></click>"
    - ""
    - "<gray>Then configure it (only destination is required):</gray>"
    - "<click:suggest_command:'/wm portal destination '><color:#7471b0>➥</color> <color:#ff9900>destination</color> <dark_green>[name]</dark_green> <dark_aqua><world></dark_aqua> <dark_gray>-</dark_gray> <color:#ffa1f9>Where it teleports to (or your position)</color></click>"
    - "<click:suggest_command:'/wm portal permission '><color:#7471b0>➥</color> <color:#ff9900>permission</color> <dark_green>[name]</dark_green> <dark_aqua><node></dark_aqua> <dark_gray>-</dark_gray> <color:#ffa1f9>Require a permission to use it</color></click>"
    - "<click:suggest_command:'/wm portal price '><color:#7471b0>➥</color> <color:#ff9900>price</color> <dark_green>[name]</dark_green> <dark_aqua><amount></dark_aqua> <dark_gray>-</dark_gray> <color:#ffa1f9>Charge Vault money to use it</color></click>"
    - "<click:suggest_command:'/wm portal launch '><color:#7471b0>➥</color> <color:#ff9900>launch</color> <dark_green>[name]</dark_green> <dark_aqua><dx> <dy> <dz></dark_aqua> <dark_gray>-</dark_gray> <color:#ffa1f9>Launch velocity on entry (cannon)</color></click>"
    - "<click:suggest_command:'/wm portal list'><color:#7471b0>➥</color> <color:#ff9900>list</color> <dark_gray>-</dark_gray> <color:#ffa1f9>List every portal region</color></click>"
    - "<click:suggest_command:'/wm portal remove '><color:#7471b0>➥</color> <color:#ff9900>remove</color> <dark_green>[name]</dark_green> <dark_gray>-</dark_gray> <color:#ffa1f9>Delete a portal region</color></click>"
  unknown_action: "<red>Error:</red> Unknown portal action: {0}"
  usage_create: "<red>Usage: <gold>/wm portal create <name></gold></red>"
  usage_remove: "<red>Usage: <gold>/wm portal remove <name></gold></red>"
  usage_destination: "<red>Usage: <gold>/wm portal destination <name> [world]</gold></red>"
  usage_permission: "<red>Usage: <gold>/wm portal permission <name> [node|clear]</gold></red>"
  usage_price: "<red>Usage: <gold>/wm portal price <name> <amount></gold></red>"
  usage_launch: "<red>Usage: <gold>/wm portal launch <name> <dx> <dy> <dz>|clear</gold></red>"
  pos1_set: "<green>Position 1 set:</green> {0}, {1}, {2}. Now stand at the opposite corner and run <click:suggest_command:'/wm portal pos2'><yellow><u>/wm portal pos2</u></yellow></click>."
  pos2_set: "<green>Position 2 set:</green> {0}, {1}, {2}. Run <click:suggest_command:'/wm portal create '><yellow><u>/wm portal create [name]</u></yellow></click> to finish."
  missing_selection: "<red>Error:</red> Set both corners first: <click:suggest_command:'/wm portal pos1'><yellow><u>/wm portal pos1</u></yellow></click> <gray>then</gray> <click:suggest_command:'/wm portal pos2'><yellow><u>/wm portal pos2</u></yellow></click>."
  created: "<green>Portal region \"{0}\" created!</green> Set a destination with <click:suggest_command:'/wm portal destination {0} '><yellow><u>/wm portal destination {0}</u></yellow></click>."
  name_taken: "<red>Error:</red> A portal named \"{0}\" already exists."
  not_found: "<red>Error:</red> No portal named \"{0}\" was found."
  removed: "<green>Portal \"{0}\" removed.</green>"
  destination_set: "<green>Destination for \"{0}\" set to your position in {1}.</green> <gray>Optional next steps:</gray> <click:suggest_command:'/wm portal'><yellow><u>/wm portal</u></yellow></click>"
  permission_set: "<green>Permission for \"{0}\" set to:</green> <aqua>{1}</aqua>"
  price_set: "<green>Price for \"{0}\" set to:</green> <aqua>{1}</aqua>"
  invalid_price: "<red>Error:</red> Invalid price: {0}"
  launch_set: "<green>Launch velocity for \"{0}\" set.</green>"
  launch_cleared: "<green>Launch velocity for \"{0}\" cleared.</green>"
  invalid_launch: "<red>Error:</red> Launch velocity must be three numbers: dx dy dz"
  no_permission: "<red>Error:</red> You don't have permission to use this portal."
  cant_afford: "<red>Error:</red> You can't afford this portal ({0})."
  destination_not_loaded: "<red>Error:</red> This portal's destination world isn't currently loaded."
  list_empty: "<gray>No custom portals have been created yet.</gray> <click:suggest_command:'/wm portal'><yellow><u>/wm portal</u></yellow></click> <gray>to get started.</gray>"
  list_header: "<green>Custom portals:</green>"
  list_item: "<color:#7471b0>➥</color> <yellow>{0}</yellow> <gray>in</gray> {1} <gray>→</gray> <aqua>{2}</aqua> <gray>| price:</gray> {3} <gray>| perm:</gray> {4}"

