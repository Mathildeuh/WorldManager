pregen:
  guide:
    - "<color:#7d66ff>{</color><color:#6258a6>-----</color> <color:#02a876>World Pre-generation</color> <color:#6258a6>-----</color><color:#7d66ff>}</color>"
    - "<gray>Generates chunks around a center point ahead of time, so players never hit generation lag exploring it later.</gray>"
    - "<click:suggest_command:'/wm pregen start '><color:#7471b0>➥</color> <color:#ff9900>start</color> <dark_green>[world]</dark_green> <dark_aqua>center:x,z radius:n</dark_aqua> <dark_gray>-</dark_gray> <color:#ffa1f9>Begin pre-generating (radius in chunks)</color></click>"
    - "<click:suggest_command:'/wm pregen pause '><color:#7471b0>➥</color> <color:#ff9900>pause</color> <dark_green>[world]</dark_green> <dark_gray>-</dark_gray> <color:#ffa1f9>Pause a running pre-generation</color></click>"
    - "<click:suggest_command:'/wm pregen resume '><color:#7471b0>➥</color> <color:#ff9900>resume</color> <dark_green>[world]</dark_green> <dark_gray>-</dark_gray> <color:#ffa1f9>Resume a paused pre-generation</color></click>"
    - "<click:suggest_command:'/wm pregen stop '><color:#7471b0>➥</color> <color:#ff9900>stop</color> <dark_green>[world]</dark_green> <dark_gray>-</dark_gray> <color:#ffa1f9>Stop and discard a running pre-generation</color></click>"
  finished: "Pre-generation finished successfully! {0} chunks generated."
  start: "Started pre-generation for world \"{0}\" with center ({1},{2}) and radius {3} chunks."
  pause: "Paused pre-generation for world \"{0}\"."
