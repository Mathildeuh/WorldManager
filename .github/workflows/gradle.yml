name: Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build project with alt.gradle
        run: ./gradlew -b alt.gradle shadowJar --no-daemon

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: WorldManager-jar
          path: out/WorldManager*.jar
          retention-days: 7

  create_release:
    needs: build
    # Only cut a GitHub release from a real push to master, never from a pull request
    # (a fork PR has no write access to create one anyway, and a same-repo PR shouldn't
    # publish a release before it's actually merged).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: WorldManager-jar
          path: out

      - name: Extract version from build.gradle
        id: extract_version
        run: |
          version=$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)
          if [ -z "$version" ]; then
            echo "::error::Could not extract version from build.gradle"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"

      - name: Get last commit message
        id: get_commit_message
        run: |
          {
            echo "COMMIT_MESSAGE<<EOF"
            git log -1 --pretty=%B
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Rename JAR file with version
        run: |
          version="${{ steps.extract_version.outputs.VERSION }}"
          mv ./out/WorldManager*.jar "./out/WorldManager-${version}.jar"

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.extract_version.outputs.VERSION }}
          name: V${{ steps.extract_version.outputs.VERSION }}
          body: ${{ steps.get_commit_message.outputs.COMMIT_MESSAGE }}
          draft: false
          prerelease: false
          files: ./out/WorldManager-${{ steps.extract_version.outputs.VERSION }}.jar
